<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajay Developer | Verified Portfolio</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Poppins:wght@300;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-red: #ff0000;
            --dark-red: #3d0000;
            --bg-black: #080808;
            --blue-tick: #1DA1F2;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: white;
            overflow-x: hidden;
        }

        /* --- 1. Header with Tabs --- */
        header {
            position: fixed; top: 0; width: 100%;
            padding: 20px 10%;
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid var(--neon-red);
            display: flex; justify-content: space-between;
            align-items: center; z-index: 1000;
            box-shadow: 0 0 15px var(--neon-red);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-red); font-weight: 900; font-size: 1.5rem;
        }

        nav ul {
            display: flex; list-style: none; gap: 25px;
        }

        nav ul li a {
            text-decoration: none; color: white;
            font-weight: 600; font-size: 1rem;
            transition: 0.3s; text-transform: uppercase;
        }

        nav ul li a:hover {
            color: var(--neon-red);
            text-shadow: 0 0 10px var(--neon-red);
        }

        /* --- 2. Hero Section --- */
        .hero {
            height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; background: radial-gradient(circle, var(--dark-red) 0%, var(--bg-black) 100%);
        }

        .profile-img-container {
            width: 200px; height: 200px;
            border: 4px solid var(--neon-red);
            border-radius: 50%; padding: 5px;
            margin-bottom: 20px; box-shadow: 0 0 30px var(--neon-red);
            position: relative; overflow: hidden;
            background: #111; display: flex; align-items: center; justify-content: center;
        }

        .profile-img-container img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
        }

        .name-wrapper {
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem; text-transform: uppercase;
            letter-spacing: 5px; color: #fff;
        }

        .blue-tick {
            color: var(--blue-tick); font-size: 2.5rem;
            filter: drop-shadow(0 0 5px var(--blue-tick));
        }

        .hero p {
            font-size: 1.5rem; color: #ccc; margin-top: 10px;
            letter-spacing: 2px;
        }

        .hero .red-text {
            color: var(--neon-red); font-weight: bold;
        }

        /* --- 3. Advanced Grid (6 Dabba) --- */
        .grid-section {
            padding: 100px 10%;
        }

        .section-title {
            text-align: center; font-size: 2.5rem; margin-bottom: 50px;
            font-family: 'Orbitron', sans-serif; color: var(--neon-red);
            text-shadow: 0 0 10px var(--neon-red);
        }

        .photo-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px;
        }

        .dabba {
            height: 350px; background: #111;
            border: 1px solid var(--dark-red);
            border-radius: 15px; position: relative;
            overflow: hidden; transition: 0.5s;
            cursor: pointer;
        }

        .dabba:hover {
            transform: scale(1.05);
            border-color: var(--neon-red);
            box-shadow: 0 0 25px var(--neon-red);
        }

        .dabba img {
            width: 100%; height: 100%; object-fit: cover; opacity: 0.6; transition: 0.5s;
        }

        .dabba:hover img { opacity: 1; }

        .upload-placeholder {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; pointer-events: none;
        }

        /* --- 4. Social Links --- */
        .socials {
            margin-top: 30px; display: flex; gap: 20px;
        }

        .social-btn {
            width: 50px; height: 50px; border: 1px solid var(--neon-red);
            display: grid; place-items: center; border-radius: 50%;
            color: white; text-decoration: none; transition: 0.4s;
        }

        .social-btn:hover {
            background: var(--neon-red); box-shadow: 0 0 20px var(--neon-red);
            transform: rotate(360deg);
        }

    </style>
</head>
<body>

    <header>
        <div class="logo">AJAY PRO</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Portfolio</a></li>
                <li><a href="#">Skills</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="profile-img-container">
            <img src="https://via.placeholder.com/200" alt="Ajay Shukla">
        </div>

        <div class="name-wrapper">
            <h1>AJAY DEVELOPER</h1>
            <i class="fas fa-check-circle blue-tick"></i>
        </div>

        <p><span class="red-text">BCA STUDENT</span> | WEB DEVELOPER</p>

        <div class="socials">
            <a href="#" class="social-btn"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-btn"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social-btn"><i class="fab fa-youtube"></i></a>
        </div>
    </section>

    <section class="grid-section">
        <h2 class="section-title">PROJECT GALLERY</h2>
        <div class="photo-grid">
            <div class="dabba"><div class="upload-placeholder"><i class="fas fa-plus"></i><br>Add Image</div></div>
            <div class="dabba"><div class="upload-placeholder"><i class="fas fa-plus"></i><br>Add Image</div></div>
            <div class="dabba"><div class="upload-placeholder"><i class="fas fa-plus"></i><br>Add Image</div></div>
            <div class="dabba"><div class="upload-placeholder"><i class="fas fa-plus"></i><br>Add Image</div></div>
            <div class="dabba"><div class="upload-placeholder"><i class="fas fa-plus"></i><br>Add Image</div></div>
            <div class="dabba"><div class="upload-placeholder"><i class="fas fa-plus"></i><br>Add Image</div></div>
        </div>
    </section>

    <footer style="text-align: center; padding: 40px; color: var(--neon-red); font-size: 0.8rem;">
        &copy; 2026 AJAY SHUKLA | ALL RIGHTS RESERVED
    </footer>

    <script>
        // Smooth scroll effect for navigation
        document.querySelectorAll('nav a').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                console.log("Navigating to: " + this.innerText);
            });
        });
    </script>
</body>
</html>
