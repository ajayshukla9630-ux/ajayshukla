<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajay Developer Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Modern Variables */
        :root {
            --primary: #0061ff;
            --secondary: #60efff;
            --dark: #1a1a1a;
            --glass: rgba(255, 255, 255, 0.9);
        }

        /* Smooth Scrolling */
        html { scroll-behavior: smooth; }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            color: #333; 
            line-height: 1.6;
        }

        /* PREMIUM TOP BANNER */
        .top-banner { 
            height: 250px; 
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            width: 100%; 
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0% 100%); /* Modern Slant Cut */
        }

        nav {
            display: flex;
            justify-content: center;
            padding-top: 25px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            transition: 0.3s;
            padding: 5px 12px;
            border-radius: 20px;
        }

        nav ul li a:hover {
            background: white;
            color: var(--primary);
        }

        /* CONTAINER & GLASS CARDS */
        .container { max-width: 850px; margin: -80px auto 40px; padding: 0 20px; }

        .card { 
            background: var(--glass); 
            backdrop-filter: blur(10px);
            margin-top: 30px; 
            padding: 40px 30px; 
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); 
            border: 1px solid rgba(255,255,255,0.3);
            transition: transform 0.3s ease;
        }

        .card:hover { transform: translateY(-5px); }

        /* PROFILE SECTION */
        .home-section { text-align: center; }
        
        .profile-img-container {
            width: 150px;
            height: 150px;
            margin: -115px auto 0;
            position: relative;
        }

        .profile-img { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            border: 6px solid white; 
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background-color: #fff;
            transition: 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .profile-img:hover {
            transform: scale(1.1) rotate(5deg);
            border-color: var(--secondary);
        }

        .home-section h1 { 
            margin-top: 20px; 
            font-size: 32px; 
            color: var(--dark);
            font-weight: 800;
        }

        .home-section p { color: #666; font-size: 18px; margin-top: 8px; font-weight: 500; }

        /* HEADINGS */
        h2 { 
            background: linear-gradient(to right, var(--primary), #00c6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block; 
            margin-bottom: 20px; 
            font-size: 24px;
            font-weight: 700;
        }

        /* SKILLS */
        .skills-container { 
            display: flex; 
            justify-content: center; 
            flex-wrap: wrap; 
            gap: 25px; 
            margin-top: 20px; 
            font-size: 45px; 
        }

        .skills-container i { 
            transition: 0.4s ease; 
            cursor: pointer;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
        }

        .skills-container i:hover { 
            transform: scale(1.3) translateY(-10px); 
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
        }

        /* GALLERY */
        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
            margin-top: 25px; 
        }

        .gallery-card { 
            border-radius: 18px; 
            overflow: hidden; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .gallery-card img { 
            width: 100%; 
            height: 220px; 
            object-fit: cover; 
            display: block; 
            transition: 0.5s;
        }

        .gallery-card:hover img { transform: scale(1.1); }

        /* CONTACT */
        .contact-info div { 
            background: rgba(0,0,0,0.03);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px; 
            font-size: 16px; 
            display: flex;
            align-items: center;
        }

        .contact-info i { color: var(--primary); margin-right: 15px; font-size: 20px; }

        /* Responsive Mobile View */
        @media (max-width: 600px) {
            nav ul { gap: 5px; padding: 8px 10px; }
            nav ul li a { font-size: 10px; padding: 5px 8px; }
            .top-banner { height: 180px; }
            .home-section h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="top-banner">
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#portfolio">Portfolio</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </div>

    <div class="container">
        
        <div class="card home-section" id="home">
            <div class="profile-img-container">
                <img src="ajay-profile.jpg" alt="Ajay Developer" class="profile-img">
