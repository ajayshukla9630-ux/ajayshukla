<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajay Shukla | Senior Developer Portfolio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --neon-red: #ff0000;
            --dark-bg: #050505;
            --card-bg: rgba(20, 20, 20, 0.8);
            --blue-tick: #1da1f2;
            --text-gray: #a0a0a0;
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* --- ADVANCED BASE STYLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Custom Cursor Animation */
        #custom-cursor {
            width: 20px; height: 20px; border: 2px solid var(--neon-red);
            border-radius: 50%; position: fixed; pointer-events: none;
            z-index: 9999; transition: transform 0.1s;
        }

        /* --- HEADER & NAVIGATION --- */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px);
            border-bottom: 1px solid #222; padding: 20px 8%;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-family: 'Syncopate', sans-serif; font-weight: 700; color: var(--neon-red); letter-spacing: 2px; }
        
        nav ul { display: flex; list-style: none; gap: 30px; }
        nav ul li a {
            text-decoration: none; color: #fff; font-size: 13px; font-weight: 500;
            text-transform: uppercase; letter-spacing: 1px; transition: var(--transition);
        }
        nav ul li a:hover { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); }

        /* --- HERO SECTION (PHOTO ABOVE NAME) --- */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center;
            padding: 0 8%; background: radial-gradient(circle at 80% 20%, #200000 0%, #050505 60%);
        }
        
        .hero-image-wrapper { margin-bottom: 30px; position: relative; width: fit-content; }
        .hero-image-wrapper img {
            width: 150px; height: 150px; border-radius: 50%;
            border: 4px solid var(--neon-red); object-fit: cover;
            animation: pulse 2s infinite;
        }

        .hero h1 {
            font-family: 'Syncopate', sans-serif; font-size: clamp(40px, 8vw, 90px);
            text-transform: uppercase; line-height: 0.9;
        }
        .blue-tick { color: var(--blue-tick); font-size: 0.4em; vertical-align: middle; margin-left: 10px; }

        /* --- ABOUT SECTION (PICTURE BELOW CONTENT) --- */
        section { padding: 120px 8%; border-bottom: 1px solid #111; }
        .section-title {
            font-family: 'Syncopate', sans-serif; color: var(--neon-red);
            font-size: 40px; margin-bottom: 50px; text-align: left;
        }

        .about-container { display: flex; flex-direction: column; gap: 40px; }
        .about-text { max-width: 800px; font-size: 20px; color: var(--text-gray); }
        .about-picture {
            width: 100%; max-width: 1000px; border-radius: 20px;
            overflow: hidden; border: 1px solid #333; margin-top: 20px;
        }
        .about-picture img { width: 100%; transition: 1s ease; filter: grayscale(1); }
        .about-picture:hover img { filter: grayscale(0); transform: scale(1.02); }

        /* --- SKILLS GRID --- */
        .skills-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;
        }
        .skill-card {
            background: var(--card-bg); padding: 40px; border-radius: 15px;
            border-left: 5px solid var(--neon-red); transition: var(--transition);
        }
        .skill-card:hover { transform: translateY(-10px); background: #111; }
        .skill-card i { font-size: 40px; color: var(--neon-red); margin-bottom: 20px; }

        /* --- PORTFOLIO GALLERY --- */
        .portfolio-gallery {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 30px;
        }
        .portfolio-item {
            position: relative; border-radius: 20px; overflow: hidden; height: 450px;
        }
        .portfolio-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; }
        .portfolio-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column; justify-content: center;
            padding: 40px; opacity: 0; transition: 0.4s;
        }
        .portfolio-item:hover .portfolio-overlay { opacity: 1; }
        .portfolio-item:hover img { transform: scale(1.1); }

        /* --- CONTACT --- */
        .contact-flex
