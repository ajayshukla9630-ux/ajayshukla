<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Skills - Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        /* Header Section */
        .skills-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .skills-header h1 {
            color: #ff0000; /* Red Theme */
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 10px;
        }

        .skills-header p {
            color: #888;
            font-style: italic;
        }

        /* Skills Grid Layout */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        /* Skill Cards */
        .skill-card {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 30px;
            border-radius: 20px;
            transition: 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .skill-card:hover {
            border-color: #ff0000;
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.1);
        }

        .skill-card h3 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }

        .skill-card h3 i {
            color: #ff0000;
        }

        /* Progress Bars */
        .skill-item {
            margin-bottom: 20px;
        }

        .skill-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .progress-bg {
            background: #222;
            height: 10px;
            border-radius: 10px;
            width: 100%;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #b30000, #ff0000);
            border-radius: 10px;
            width: 0; /* JS or Manual width */
            transition: 2s ease-in-out;
        }

        /* Soft Skills List */
        .soft-skills-list {
            list-style: none;
        }

        .soft-skills-list li {
            background: #151515;
            margin-bottom: 10px;
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 3px solid #ff0000;
        }

        .soft-skills-list i {
            color: #00ff88; /* Green checkmark */
        }

        /* AI & Language Section */
        .extra-section {
            margin-top: 40px;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
        }

        .ai-box {
            background: linear-gradient(145deg, #0a0a0a, #1a0505);
            padding: 30px;
            border-radius: 20px;
            border: 1px dashed #ff0000;
        }

        .ai-box h3 { color: #ff0000; margin-bottom: 10px; }

        .lang-box {
            background: #0a0a0a;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #222;
        }

        .lang-tag {
            display: inline-block;
            background: #222;
            padding: 5px 15px;
            border-radius: 50px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #ff0000;
        }

        /* Footer Decoration */
        .footer-line {
            height: 4px;
            background: #ff0000;
            width: 100px;
            margin: 50px auto;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .extra-section { grid-template-columns: 1fr; }
            .skills-header h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="skills-header">
        <h1>Technical Skills</h1>
        <p>Turning logic into code & ideas into reality.</p>
    </header>

    <div class="skills-grid">
        <div class="skill-card">
            <h3><i class="fas fa-code"></i> Coding Skills</h3>
            
            <div class="skill-item">
                <div class="skill-info"><span>HTML5 / CSS3</span><span>85%</span></div>
                <div class="progress-bg"><div class="progress-fill" style="width: 85%;"></div></div>
            </div>

            <div class="skill-item">
                <div class="skill-info"><span>JavaScript (Basic)</span><span>60%</span></div>
                <div class="progress-bg"><div class="progress-fill" style="width: 60%;"></div></div>
            </div>

            <div class="skill-item">
                <div class="skill-info"><span>C / Python (Basic)</span><span>50%</span></div>
                <div class="progress-bg"><div class="progress-fill" style="width: 50%;"></div></div>
            </div>
        </div>

        <div class="skill-card">
            <h3><i class="fas fa-layer-group"></i> Software & Tools</h3>
            
            <div class="skill-item">
                <div class="skill-info"><span>MS Office (Word, Excel, PPT)</span><span>80%</span></div>
                <div class="progress-bg"><div class="progress-fill" style="width: 80%;"></div></div>
            </div>

            <div class="skill-item">
                <div class="skill-info"><span>Tally Prime (Basic)</span><span>85%</span></div>
                <div class="progress-bg"><div class="progress-fill" style="width: 85%;"></div></div>
            </div>

            <div class="skill-item">
                <div class="skill-info"><span>Web UI Design</span><span>70%</span></div>
                <div class="progress-bg"><div class="progress-fill" style="width: 70%;"></div></div>
            </div>
        </div>

        <div class="skill-card">
            <h3><i class="fas fa-user-tie"></i> Soft Skills</h3>
            <ul class="soft-skills-list">
                <li><i class="fas fa-check-circle"></i> Problem Solving</li>
                <li><i class="fas fa-check-circle"></i> Adaptive Learning
