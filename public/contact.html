<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Ajay Shukla</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --red:#ff0000;
    --dark:#0b0b0b;
    --black:#000000;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:var(--dark);
    color:white;
}

/* BACK STRIP */
.back-strip{
    width:100%;
    background:var(--black);
    padding:15px 20px;
}

.back-strip a{
    text-decoration:none;
    color:#bdbdbd;
    font-size:16px;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
}

.back-strip a i{
    color:var(--red);
}

/* CONTACT */
.contact{
    max-width:900px;
    margin:40px auto;
    padding:20px;
}

.contact h1{
    text-align:center;
    color:var(--red);
    font-size:44px;
}

.contact p{
    text-align:center;
    color:#cfcfcf;
    margin:10px 0 40px;
}

/* INFO BOX */
.contact-box{
    border:2px solid var(--red);
    border-radius:25px;
    padding:30px;
    margin-bottom:40px;
}

.info-item{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
    color:#ddd;
}

.info-item i{
    color:var(--red);
    font-size:20px;
}

/* SOCIAL */
.social{
    display:flex;
    gap:20px;
    margin-top:25px;
}

.social a{
    width:45px;
    height:45px;
    border:2px solid var(--red);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--red);
    transition:0.3s;
    text-decoration:none;
}

.social a:hover{
    background:var(--red);
    color:black;
}

/* FORM */
.form-box{
    border:2px solid var(--red);
    border-radius:25px;
    padding:30px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
}

.form-group input,
.form-group textarea{
    width:100%;
    background:transparent;
    border:2px solid var(--red);
    border-radius:12px;
    padding:12px;
    color:white;
    outline:none;
}

.form-group textarea{
    resize:none;
    height:120px;
}

/* SEND BUTTON */
.send-btn{
    width:100%;
    padding:14px;
    background:transparent;
    border:2px solid var(--red);
    border-radius:30px;
    color:var(--red);
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.send-btn:hover{
    background:var(--red);
    color:black;
}

/* FOOTER (RED PATTI HATA DI) */
footer{
    text-align:center;
    padding:25px;
    margin-top:40px;
    color:var(--red);
}
</style>
</head>

<body>

<!-- BACK (WORKING) -->
<div class="back-strip">
    <a onclick="history.back()">
        <i class="fa-solid fa-arrow-left"></i> Home to Back
    </a>
</div>

<section class="contact">

<h1>CONTACT</h1>
<p>Have a question or want to work together? Drop a message!</p>

<!-- INFO -->
<div class="contact-box">
    <div class="info-item">
        <i class="fa-solid fa-envelope"></i> ajayshukla@email.com
    </div>
    <div class="info-item">
        <i class="fa-solid fa-phone"></i> +91 YourNumber
    </div>
    <div class="info-item">
        <i class="fa-solid fa-location-dot"></i> Sidhi, Madhya Pradesh
    </div>

    <div class="social">
        <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
        <a href="#"><i class="fa-brands fa-github"></i></a>
        <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
    </div>
</div>

<!-- FORM -->
<div class="form-box">
    <div class="form-group">
        <label>Your Name</label>
        <input type="text" placeholder="Enter your name">
    </div>

    <div class="form-group">
        <label>Email Address</label>
        <input type="email" placeholder="Enter your email">
    </div>

    <div class="form-group">
        <label>Message</label>
        <textarea placeholder="How can I help you?"></textarea>
    </div>

    <button class="send-btn">Send Message</button>
</div>

</section>

<footer>
    © 2026 Designed by Ajay Shukla
</footer>

</body>
</html>
