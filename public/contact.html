<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajay Pro | Contact</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
    --red:#ff0000;
    --dark:#0a0a0a;
    --dark2:#111;
    --text:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:var(--dark);
    color:var(--text);
}

/* ===== CONTACT SECTION ===== */
#contact{
    padding:80px 15px;
    text-align:center;
}

#contact h2{
    color:var(--red);
    font-size:34px;
    letter-spacing:2px;
    margin-bottom:10px;
}

#contact p{
    color:#ccc;
    margin-bottom:40px;
}

/* WRAPPER */
.contact-wrapper{
    max-width:1100px;
    margin:auto;
    display:flex;
    gap:30px;
    flex-wrap:wrap;
    justify-content:center;
}

/* LEFT CARD */
.contact-card{
    flex:1;
    min-width:280px;
    background:linear-gradient(145deg,#0f0f0f,#050505);
    border:2px solid var(--red);
    border-radius:18px;
    padding:30px;
    text-align:left;
    box-shadow:0 0 25px rgba(255,0,0,0.15);
}

.contact-card h3{
    color:var(--red);
    margin-bottom:20px;
    font-size:22px;
}

.contact-card p{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:15px;
    color:#ddd;
    font-size:15px;
}

.contact-card i{
    color:var(--red);
    font-size:18px;
}

/* SOCIAL ICONS */
.social{
    margin-top:20px;
    display:flex;
    gap:15px;
}

.social a{
    width:42px;
    height:42px;
    border:1px solid var(--red);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--red);
    transition:.3s;
}

.social a:hover{
    background:var(--red);
    color:black;
    box-shadow:0 0 15px var(--red);
}

/* RIGHT FORM */
.contact-form{
    flex:1.2;
    min-width:280px;
    background:linear-gradient(145deg,#0f0f0f,#050505);
    border:2px solid var(--red);
    border-radius:18px;
    padding:30px;
    box-shadow:0 0 25px rgba(255,0,0,0.15);
}

.contact-form label{
    display:block;
    text-align:left;
    margin-bottom:6px;
    color:#ccc;
    font-size:14px;
}

.contact-form input,
.contact-form textarea{
    width:100%;
    padding:12px;
    margin-bottom:18px;
    border-radius:10px;
    border:1px solid var(--red);
    background:#0a0a0a;
    color:white;
    outline:none;
}

.contact-form textarea{
    resize:none;
    height:120px;
}

.contact-form button{
    background:transparent;
    color:var(--red);
    border:2px solid var(--red);
    padding:12px 35px;
    border-radius:30px;
    cursor:pointer;
    font-size:15px;
    transition:.3s;
}

.contact-form button:hover{
    background:var(--red);
    color:black;
    box-shadow:0 0 20px var(--red);
}

/* FOOTER */
footer{
    margin-top:80px;
    text-align:center;
    color:var(--red);
    font-size:14px;
}

/* RESPONSIVE */
@media(max-width:768px){
    .contact-wrapper{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<section id="contact">
    <h2>CONTACT</h2>
    <p>Have a question or want to work together?<br>Drop a message!</p>

    <div class="contact-wrapper">

        <!-- LEFT INFO -->
        <div class="contact-card">
            <h3>Contact Information</h3>

            <p><i class="fa-solid fa-envelope"></i> ajayshukla@email.com</p>
            <p><i class="fa-solid fa-phone"></i> +91 YourNumber</p>
            <p><i class="fa-solid fa-location-dot"></i> Sidhi, Madhya Pradesh</p>

            <div class="social">
                <a href="#"><i class="fab fa-linkedin"></i></a>
                <a href="#"><i class="fab fa-github"></i></a>
                <a href="#"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>

        <!-- RIGHT FORM -->
        <form class="contact-form" onsubmit="sendMsg(event)">
            <label>Your Name</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Message</label>
            <textarea placeholder="How can I help you?" required></textarea>

            <button type="submit">
                Send Message <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>

    </div>
</section>

<footer>
    © 2026 | Designed by AJAY SHUKLA
</footer>

<script>
function sendMsg(e){
    e.preventDefault();
    alert("Message sent successfully!");
}
</script>

</body>
</html>
